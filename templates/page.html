{% extends "base.html" %}

{% block content %}
<article aria-labelledby="post-title">
  <section>
    <h2 id="post-title">{{ page.title }}</h2>
    <p class="meta">{% if page.date %}{{ page.date }} · {% endif %}<a href="/blog/">Back to blog</a></p>
    {{ page.content | safe }}
  </section>
</article>
{% endblock content %}
